[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blast-freezing-black-hole"
version = "1.0.2"
description = "Scientific routines for Blast freezing a black hole."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSES/MIT.txt" }
dependencies = [
    "numpy>=2",
    "scipy>=1.14",
]

[project.optional-dependencies]
finite-p = [
    "pandas>=2",
    "torch>=2",
]
plotting = [
    "matplotlib>=3",
]

[project.urls]
Repository = "https://github.com/shoaibphysics/blast-freezing-black-hole"

[tool.hatch.build.targets.wheel]
packages = [
    "code/src/large_p",
    "code/src/finite_p",
    "code/src/bulk_reconstruction",
    "code/src/application",
]

[tool.hatch.build.targets.sdist]
include = [
    "code/src",
    "pyproject.toml",
    "README.md",
    "LICENSES/MIT.txt",
]
